<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber-Encryption Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
</script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1a2e;
  overflow: hidden;
}

#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 720px;
  padding: 2rem;
}

.glass {
  background: rgba(26, 26, 46, 0.55);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 2.5rem;
  box-shadow:
    0 30px 60px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.panel {
  padding: 2.5rem;
}

h1 {
  text-align: center;
  font-weight: 300;
  font-size: 1.8rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #e0e0ff;
  margin-bottom: 0.25rem;
  text-shadow: 0 0 30px rgba(100, 140, 255, 0.3);
}

.subtitle {
  text-align: center;
  font-weight: 300;
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  color: rgba(160, 180, 255, 0.5);
  margin-bottom: 1.2rem;
}

.status-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  margin-bottom: 1.4rem;
}

.led-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.led {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #3a3a4a;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
  transition: background 0.35s, box-shadow 0.35s;
  flex-shrink: 0;
}

.led.led-white { background: #d8d8ff; box-shadow: 0 0 12px rgba(180, 180, 255, 0.5), inset 0 0 4px rgba(255,255,255,0.3); }
.led.led-red   { background: #ff3a3a; box-shadow: 0 0 18px rgba(255, 58, 58, 0.7), inset 0 0 6px rgba(255,200,200,0.3); }
.led.led-yellow{ background: #ffe033; box-shadow: 0 0 18px rgba(255, 224, 51, 0.7), inset 0 0 6px rgba(255,255,200,0.3); }
.led.led-green { background: #3aff88; box-shadow: 0 0 18px rgba(58, 255, 136, 0.7), inset 0 0 6px rgba(200,255,220,0.3); }

.led-label {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(160, 180, 255, 0.3);
  font-variant-numeric: tabular-nums;
}

.btn-reload {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  min-width: unset;
  flex: none;
  background: rgba(40, 50, 80, 0.5);
  color: rgba(160, 180, 255, 0.5);
  box-shadow:
    -3px -3px 8px rgba(255, 255, 255, 0.02),
    3px 3px 10px rgba(0, 0, 0, 0.4);
  transition: color 0.3s, box-shadow 0.3s;
}

.btn-reload:hover {
  color: rgba(200, 220, 255, 0.9);
  box-shadow:
    -3px -3px 8px rgba(255, 255, 255, 0.04),
    3px 3px 10px rgba(0, 0, 0, 0.4),
    0 0 20px rgba(100, 140, 255, 0.08);
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 1.2rem 1.4rem;
  background: rgba(10, 10, 25, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 1.2rem;
  color: #c8d0ff;
  font-size: 0.95rem;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  resize: vertical;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  line-height: 1.6;
}

textarea:focus {
  border-color: rgba(100, 140, 255, 0.35);
  box-shadow: 0 0 30px rgba(80, 120, 255, 0.08);
}

textarea::placeholder {
  color: rgba(160, 180, 255, 0.2);
}

.output-area {
  margin-top: 1rem;
}

.output-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.output-label {
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: rgba(160, 180, 255, 0.35);
}

.copy-feedback {
  font-size: 0.65rem;
  color: #6fcf97;
  opacity: 0;
  transition: opacity 0.35s;
}

.copy-feedback.show {
  opacity: 1;
}

#output {
  background: rgba(10, 10, 25, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 1.2rem;
  padding: 1.2rem 1.4rem;
  min-height: 80px;
  color: #c8d0ff;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 0.9rem;
  word-break: break-all;
  line-height: 1.6;
  transition: border-color 0.3s;
}

.controls {
  display: flex;
  gap: 0.75rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}

.btn {
  position: relative;
  flex: 1;
  min-width: 120px;
  padding: 0.9rem 0;
  border: none;
  border-radius: 1.2rem;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.2s;
  background: rgba(30, 30, 60, 0.7);
  color: #b0c0ff;
  box-shadow:
    -6px -6px 14px rgba(255, 255, 255, 0.03),
    6px 6px 14px rgba(0, 0, 0, 0.5),
    inset 0 0 0 0 rgba(255, 255, 255, 0);
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.btn::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,255,255,0.06), transparent 50%, rgba(0,0,0,0.2));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.btn:active {
  transform: scale(0.88);
  box-shadow:
    -2px -2px 6px rgba(255, 255, 255, 0.02),
    2px 2px 8px rgba(0, 0, 0, 0.5),
    inset 0 0 20px rgba(0, 0, 0, 0.25);
}

.btn-primary {
  background: linear-gradient(135deg, rgba(60, 90, 200, 0.35), rgba(40, 60, 160, 0.25));
  color: #d0dcff;
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.03),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(80, 120, 255, 0.08);
}

.btn-primary:hover {
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.04),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 35px rgba(80, 120, 255, 0.18);
}

.btn-secondary {
  background: linear-gradient(135deg, rgba(40, 180, 120, 0.25), rgba(30, 140, 100, 0.18));
  color: #b0f0d0;
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.03),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(40, 180, 120, 0.06);
}

.btn-secondary:hover {
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.04),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 35px rgba(40, 180, 120, 0.15);
}

.btn-danger {
  background: linear-gradient(135deg, rgba(200, 60, 60, 0.2), rgba(160, 40, 40, 0.15));
  color: #ffb0b0;
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.03),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(200, 60, 60, 0.05);
}

.btn-danger:hover {
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.04),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 35px rgba(200, 60, 60, 0.12);
}

.btn-copy {
  background: linear-gradient(135deg, rgba(200, 160, 60, 0.2), rgba(160, 130, 40, 0.15));
  color: #f0e0a0;
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.03),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 20px rgba(200, 160, 60, 0.05);
}

.btn-copy:hover {
  box-shadow:
    -4px -4px 12px rgba(255, 255, 255, 0.04),
    4px 4px 16px rgba(0, 0, 0, 0.5),
    0 0 35px rgba(200, 160, 60, 0.12);
}

.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
  pointer-events: none;
}

.key-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.2rem;
}

.key-row label {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(160, 180, 255, 0.35);
  white-space: nowrap;
}

.key-row input {
  flex: 1;
  padding: 0.6rem 1rem;
  background: rgba(10, 10, 25, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 0.8rem;
  color: #c8d0ff;
  font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}

.key-row input:focus {
  border-color: rgba(100, 140, 255, 0.35);
  box-shadow: 0 0 25px rgba(80, 120, 255, 0.06);
}

@media (max-width: 540px) {
  .container { padding: 1rem; }
  .panel { padding: 1.5rem; }
  h1 { font-size: 1.2rem; }
  .controls { gap: 0.5rem; }
  .btn { min-width: 90px; font-size: 0.7rem; padding: 0.75rem 0; }
  textarea { min-height: 100px; font-size: 0.85rem; }
  #output { font-size: 0.8rem; min-height: 60px; }
  .btn-reload { width: 32px; height: 32px; font-size: 1rem; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
  <div class="glass panel">
    <h1 id="title">Cyber-Encryption Lab</h1>
    <p class="subtitle" id="subtitle">[ XE-128 Cryptographic Workbench ]</p>

    <div class="status-bar" id="statusBar">
      <div class="led-wrap">
        <div class="led led-red" id="statusLed"></div>
        <span class="led-label" id="statusLabel">error</span>
      </div>
      <button class="btn btn-reload" id="reloadBtn" title="Reload system">&#x21bb;</button>
    </div>

    <div class="key-row" id="keyRow">
      <label for="key">Key</label>
      <input type="text" id="key" value="cyber" spellcheck="false" autocomplete="off">
    </div>

    <textarea id="input" placeholder="Введите данные для шифрования..."></textarea>

    <div class="output-area" id="outputArea">
      <div class="output-header">
        <span class="output-label">Result</span>
        <span class="copy-feedback" id="copyFeedback">&#x2713; Copied</span>
      </div>
      <div id="output"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="encryptBtn">&#x1f512; Encrypt</button>
      <button class="btn btn-secondary" id="decryptBtn">&#x1f50d; Decrypt</button>
      <button class="btn btn-copy" id="copyBtn">&#x1f4cb; Copy</button>
      <button class="btn btn-danger" id="clearBtn">&#x21ba; Clear</button>
    </div>
  </div>
</div>
